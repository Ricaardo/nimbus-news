# logrotate config for news-platform
# Install: sudo cp deploy/logrotate.conf /etc/logrotate.d/news-platform
# Or run manually: logrotate -f deploy/logrotate.conf

/path/to/news/logs/platform.log
/path/to/news/logs/platform.error.log {
    daily
    rotate 7
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
